name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The WebUI is embedded via rust-embed; build.rs writes a placeholder so
      # these checks do not need a frontend build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --workspace matters: default-members is bin/lanobe, so a bare `cargo test`
      # silently runs nothing but that crate's (empty) test binary.
      - name: Test
        run: cargo test --workspace

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebUI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: WebUI/yarn.lock

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - name: Build
        env:
          PORT: 3000
          ALLOWED_HOSTS: ''
        run: npx vite build
