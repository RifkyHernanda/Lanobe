name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to GHCR - no PAT needed.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase path, and the owner login is not.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lanobe" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # linux/amd64 only: the deployment target is a t2.micro, and adding arm64
          # would roughly double a build that already compiles the whole Rust tree.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every run recompiles every crate from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "docker pull ${{ steps.image.outputs.name }}:latest"
            echo '```'
            echo
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
