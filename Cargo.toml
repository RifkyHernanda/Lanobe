[workspace]
default-members = ["bin/lanobe"]
members = [
    "bin/lanobe",
    "crates/app-server",
    "crates/audio-server",
    "crates/novel-server",
    "crates/sync-server",
    "crates/yomitan-server",
]
resolver = "2"

[workspace.package]
authors = ["Rifky Hernanda"]
edition = "2024"
keywords = ["light-novel", "epub", "reader", "japanese", "language learning"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/RifkyHernanda/Lanobe"
rust-version = "1.88.0"
version = "0.1.0"

[workspace.lints.clippy]
let_and_return = "warn"
uninlined_format_args = "warn"
unnecessary_debug_formatting = "warn"
unwrap_used = "warn"
useless_let_if_seq = "warn"
wildcard_imports = "warn"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.7", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1.11"
clap = { version = "4.0", features = ["env", "derive"] }
directories = "6.0"
futures = "0.3.23"
futures-util = "0.3.23"
mime_guess = "2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
rust-embed = "8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.7", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
zip = "6.0"

argon2 = "0.5"
hmac = "0.12"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2.0"

# Internal crates
lanobe-app-server = { path = "crates/app-server" }
lanobe-audio-server = { path = "crates/audio-server" }
lanobe-novel-server = { path = "crates/novel-server" }
lanobe-sync-server = { path = "crates/sync-server" }
lanobe-yomitan-server = { path = "crates/yomitan-server" }

[profile.test]
inherits = "release"

[profile.release]
# t2.micro has 1 GB of RAM: prefer a small binary and cheap runtime over
# aggressive inlining. lto="thin" keeps link times sane in CI.
lto = "thin"
codegen-units = 4
strip = "symbols"
